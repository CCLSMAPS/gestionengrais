<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسيير مخزون الأسمدة - CCLS ADRAR</title>
<meta name="description" content="نظام تسيير مخزون الأسمدة والفواتير والتسليمات والمستخدمين.">
<meta property="og:title" content="تسيير مخزون الأسمدة - CCLS ADRAR">
<meta property="og:description" content="نظام تسيير مخزون الأسمدة والفواتير والتسليمات والمستخدمين.">
<link rel="stylesheet" href="common.css">
</head>
<body>
<header><div style="display:flex;gap:10px;align-items:center"><button class="p" id="menu" aria-label="القائمة" style="background:var(--ac);color:#1d2b22">☰</button><h1>إدخال البيانات - الفواتير والوارد</h1></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="links" style="display:flex;gap:6px;flex-wrap:wrap"></span><span id="who" style="font-size:.85rem"></span><button class="p" id="pwb" hidden style="background:var(--ac);color:#1d2b22">كلمة المرور</button><button class="p" id="out" hidden style="background:var(--ac);color:#1d2b22">خروج</button></div></header>
<main>
<div id="cfg" class="box" hidden></div>
<div id="app" hidden>
<nav></nav>
<section id="invoices" hidden>
  <h2>تسجيل فاتورة</h2>
  <div id="iEditBanner" class="info" hidden style="border:1px solid var(--ac);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <strong id="iEditLabel">تعديل فاتورة</strong>
    <button type="button" class="f" id="cancelIEdit">إلغاء التعديل</button>
  </div>
  <form id="fi" style="align-items:start">
    <label>رقم الفاتورة<input name="invoice_no" required></label>
    <label>السنة<input name="invoice_year" type="number" required></label>
    <label>تاريخ الفاتورة<input name="invoice_date" type="date"></label>
    <label>رقم الملف (Dossier)<input name="dossier_no" list="dl" autocomplete="off"></label>
    <label>رقم بطاقة الفلاح (N° Carte Fellah)<input name="farmer_card_no" list="fcl" autocomplete="off" placeholder="رقم بطاقة الفلاح..."><div id="cardDupWarn" class="field-alert" hidden></div></label>
    <label>الاسم (Nom)<input name="client_name" autocomplete="off"></label>
    <label>اللقب / الاسم الشخصي (Prénom)<input name="farmer_name" list="fl" required autocomplete="off"><div id="nameDupWarn" class="field-alert" hidden></div></label>
    <label>نوع المحصول (Culture)<input name="culture" list="cl" autocomplete="off" placeholder="BLE, MAIS, ORGE..."></label>
    <label>المنطقة (Région)<input name="region" list="zl"></label>
    <label>هاتف الفلاح<input name="phone" type="tel"></label>
    <label>ملاحظات<input name="notes"></label>
    <div id="lines" style="grid-column:1/-1;display:grid;gap:8px"></div>
    <button type="button" class="f" id="addLine" style="justify-self:start">+ إضافة منتج</button>
    <button class="p" id="submitInvBtn">حفظ الفاتورة</button>
  </form>
  <div style="margin-top:18px;border-top:1px solid var(--bd);padding-top:14px">
    <h3 style="margin:0 0 10px">الفواتير المسجلة مؤخراً</h3>
    <label style="margin-bottom:10px">بحث في الفواتير (رقم الفاتورة، الفلاح، بطاقة الفلاح، المنتج، المنطقة)<input id="iq" type="search" autocomplete="off" placeholder="ابحث هنا..."></label>
    <div class="w" id="iT"></div>
  </div>
</section>
<section id="pickup" hidden>
  <h2>تسليم السماد للفلاحين (Bon d'enlèvement)</h2>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-bottom:10px">
    <label style="grid-column:1/-1">بحث عام (اسم الفلاح، رقم الهاتف، أو رقم الفاتورة)<input id="pq" type="search" autocomplete="off" placeholder="اكتب اسم الفلاح أو رقم الهاتف أو رقم الفاتورة..."></label>
    <label>رقم الفاتورة (مثال: 21 أو 21/2026)<input id="pn" autocomplete="off" inputmode="numeric"></label>
    <label>بحث برقم المجلد (Dossier)<input id="pd" autocomplete="off"></label>
    <label>الفاتورة<select id="pi"></select></label>
  </div>
  <div class="info" id="pinfo"></div>
  <div id="pickupStockWarn" hidden></div>
  <div id="pEditBanner" class="info" hidden style="border:1px solid var(--ac);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <strong id="pEditLabel">تعديل عملية تسليم</strong>
    <button type="button" class="f" id="cancelPEdit">إلغاء التعديل</button>
  </div>
  <form id="fp">
    <label>الكمية المستلمة (QTX)<input name="qty" type="number" step="any" min="0" required></label>
    <label>التاريخ<input name="w_date" type="date" required></label>
    <label>رقم الهيكل أو الرقم التسلسلي للبطاقة الرمادية<input name="vehicle_ref" required></label>
    <label>رقم إذن الخروج (Bon de sortie)<input name="bon_no"></label>
    <label>اسم السائق<input name="driver_name" required></label>
    <label>رقم الشاحنة<input name="truck_no" required></label>
    <label>ملاحظات<input name="note"></label>
    <button class="p" id="submitPickupBtn">تسجيل الاستلام</button>
  </form>
  <div class="w" id="pT" style="margin-top:12px"></div>
</section>
<section id="receipts" hidden>
  <h2>تسجيل الأسمدة الواردة للمخزن</h2>
  <div id="rEditBanner" class="info" hidden style="border:1px solid var(--ac);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
    <strong id="rEditLabel">تعديل عملية وارد</strong>
    <button type="button" class="f" id="cancelREdit">إلغاء التعديل</button>
  </div>
  <form id="fr">
    <label>السماد<input name="product" list="pl" required autocomplete="off"></label>
    <label>المخزن<select name="warehouse_id" id="rw"></select></label>
    <label>الكمية (QTX)<input name="qty" type="number" step="any" min="0" required></label>
    <label>التاريخ<input name="entry_date" type="date" required></label>
    <label>تاريخ انتهاء صلاحية المنتج<input name="expiry_date" type="date"></label>
    <label>ملاحظة<input name="note"></label>
    <button class="p" id="submitReceiptBtn">حفظ</button>
  </form>
  <div class="w" id="rT" style="margin-top:12px"></div>
</section>
<datalist id="pl"></datalist>
<datalist id="dl"></datalist>
<datalist id="fcl"></datalist>
<datalist id="fl"></datalist>
<datalist id="cl"><option value="BLE"><option value="MAIS"><option value="ORGE"><option value="AVOINE"><option value="TRITICALE"></datalist>
<datalist id="zl"></datalist>
</div>
</main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="common.js"></script>
<script src="dossiers-data.js"></script>
<script>
let receiptsList = [];
let editingReceiptId = null;
const STOCK_EXP_KEY = "ccls_stock_in_expiry";

function readStockExp() {
  try { return JSON.parse(localStorage.getItem(STOCK_EXP_KEY) || "{}") || {}; } catch (_) { return {}; }
}
function saveStockExp(id, exp) {
  if (id == null) return;
  try {
    const all = readStockExp();
    if (exp) all[String(id)] = exp;
    else delete all[String(id)];
    localStorage.setItem(STOCK_EXP_KEY, JSON.stringify(all));
  } catch (_) {}
}
function formatExpiryCell(exp) {
  if (!exp) return "-";
  const nowStr = today();
  const soonDate = new Date();
  soonDate.setDate(soonDate.getDate() + 30);
  const soonStr = soonDate.toISOString().slice(0, 10);
  if (exp < nowStr) return `<span class="tag-bad">${esc(exp)} (منتهي)</span>`;
  if (exp <= soonStr) return `<span class="tag-warn">${esc(exp)} (قريب الانتهاء)</span>`;
  return esc(exp);
}

function cancelReceiptEdit() {
  editingReceiptId = null;
  $("#rEditBanner").hidden = true;
  $("#fr").reset();
  $("#fr [name=entry_date]").value = today();
  requestAnimationFrame(() => { $("#submitReceiptBtn").textContent = "حفظ"; });
}
$("#cancelREdit").onclick = cancelReceiptEdit;

$("#fr").onsubmit = async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  try {
    const product_id = await productId(f.product);
    const payload = {
      product_id,
      qty: f.qty,
      entry_date: f.entry_date,
      expiry_date: f.expiry_date || null,
      warehouse_id: f.warehouse_id || null,
      note: f.note || null
    };
    let missingExpiryCol = false;
    let savedRow = null;

    if (editingReceiptId != null) {
      let { data, error } = await sb.from("stock_in").update(payload).eq("id", editingReceiptId).select("id");
      if (error && /expiry_date/i.test(error.message || "")) {
        missingExpiryCol = true;
        const { expiry_date, ...fallbackPayload } = payload;
        const retry = await sb.from("stock_in").update(fallbackPayload).eq("id", editingReceiptId).select("id");
        data = retry.data;
        error = retry.error;
      }
      if (error) throw error;
      savedRow = data?.[0] || { id: editingReceiptId };
      saveStockExp(savedRow.id, payload.expiry_date || "");
      toast(missingExpiryCol
        ? "تم تعديل الوارد؛ نفّذ supabase-setup.sql لإضافة عمود expiry_date في جدول stock_in"
        : "تم تعديل الوارد");
      cancelReceiptEdit();
    } else {
      let { data, error } = await sb.from("stock_in").insert(payload).select("id");
      if (error && /expiry_date/i.test(error.message || "")) {
        missingExpiryCol = true;
        const { expiry_date, ...fallbackPayload } = payload;
        const retry = await sb.from("stock_in").insert(fallbackPayload).select("id");
        data = retry.data;
        error = retry.error;
      }
      if (error) throw error;
      savedRow = data?.[0];
      if (savedRow?.id != null) saveStockExp(savedRow.id, payload.expiry_date || "");
      toast(missingExpiryCol
        ? "تم حفظ الوارد؛ نفّذ supabase-setup.sql لإضافة عمود expiry_date في جدول stock_in"
        : "تم حفظ الوارد");
      e.target.reset();
      $("#fr [name=entry_date]").value = today();
    }
    loadProducts(); loadReceipts();
  } catch (x) { toast(x.message, 1); }
};
async function loadReceipts() {
  const { data } = await sb.from("stock_in").select("*, products(name)").order("id", { ascending: false }).limit(50);
  const expMap = readStockExp();
  receiptsList = (data || []).map(r => ({
    ...r,
    expiry_date: r.expiry_date || expMap[String(r.id)] || ""
  }));
  $("#rT").innerHTML = tbl(["التاريخ", "السماد", "المخزن", "الكمية", "تاريخ الصلاحية", "ملاحظة", "إجراءات"],
    receiptsList.map(r => {
      const whName = WH.find(w => String(w.id) === String(r.warehouse_id))?.name || "-";
      return [
        r.entry_date,
        esc(r.products?.name),
        esc(whName),
        n(r.qty),
        formatExpiryCell(r.expiry_date),
        esc(r.note),
        `<div style="display:flex;gap:4px">
          <button type="button" class="f" data-edit-r="${r.id}">تعديل</button>
          <button type="button" class="p" data-del-r="${r.id}" style="background:var(--bad);padding:6px 10px">حذف</button>
        </div>`
      ];
    }));
}
$("#rT").onclick = async e => {
  const editBtn = e.target.closest("[data-edit-r]");
  if (editBtn) {
    const r = receiptsList.find(x => String(x.id) === editBtn.dataset.editR);
    if (!r) return;
    editingReceiptId = r.id;
    const pName = r.products?.name || "";
    $("#rEditLabel").textContent = `تعديل وارد #${r.id} (${pName})`;
    $("#rEditBanner").hidden = false;
    $("#fr [name=product]").value = pName;
    fillWh("#rw", pName);
    $("#rw").value = r.warehouse_id != null ? String(r.warehouse_id) : "";
    $("#fr [name=qty]").value = r.qty ?? "";
    $("#fr [name=entry_date]").value = r.entry_date || today();
    $("#fr [name=expiry_date]").value = r.expiry_date || "";
    $("#fr [name=note]").value = r.note || "";
    $("#submitReceiptBtn").textContent = "حفظ التعديل";
    $("#receipts").scrollIntoView({ behavior: "smooth", block: "start" });
    return;
  }
  const delBtn = e.target.closest("[data-del-r]");
  if (delBtn) {
    const id = delBtn.dataset.delR;
    if (!confirm("حذف عملية الوارد هذه؟")) return;
    const { error } = await sb.from("stock_in").delete().eq("id", id);
    if (error) return toast(error.message, 1);
    saveStockExp(id, "");
    if (String(editingReceiptId) === String(id)) cancelReceiptEdit();
    toast("تم حذف الوارد");
    loadProducts();
    loadReceipts();
  }
};
function addLine() {
  const d = document.createElement("div"); d.className = "line";
  d.style.cssText = "display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px;align-items:end;border:1px solid var(--bd);border-radius:8px;padding:8px";
  d.innerHTML = `<label>المنتج<input data-p list="pl" required autocomplete="off" placeholder="سماد، مبيد، بذور..."></label>
    <label>الكمية (QTX)<input data-q type="number" step="any" min="0" required></label>
    <label>السعر للوحدة<input data-u type="number" step="any" min="0"></label>
    <label>المخزن<select data-w></select></label>
    <button type="button" class="f" data-x>حذف السطر</button>`;
  $("#lines").append(d);
  const w = d.querySelector("[data-w]"); fillWh(w, "");
  d.querySelector("[data-p]").addEventListener("input", e => fillWh(w, e.target.value));
}
$("#addLine").onclick = addLine;
$("#lines").onclick = e => { if (e.target.matches("[data-x]") && $("#lines").children.length > 1) e.target.closest(".line").remove(); };
const INV_META_KEY = "ccls_invoice_meta";
function readInvMeta() {
  try { return JSON.parse(localStorage.getItem(INV_META_KEY) || "{}") || {}; } catch (_) { return {}; }
}
function saveInvMeta(invoiceNo, invoiceYear, meta) {
  if (!invoiceNo || !invoiceYear) return;
  try {
    const all = readInvMeta();
    all[`${String(invoiceNo).trim()}|${invoiceYear}`] = meta;
    localStorage.setItem(INV_META_KEY, JSON.stringify(all));
  } catch (_) {}
}

let editingInvId = null;
let recentInvoices = [];

function cancelInvoiceEdit() {
  editingInvId = null;
  $("#iEditBanner").hidden = true;
  $("#addLine").hidden = false;
  $("#fi").reset();
  $("#lines").innerHTML = "";
  addLine();
  init2();
  $("#cardDupWarn").hidden = true;
  $("#nameDupWarn").hidden = true;
  requestAnimationFrame(() => { $("#submitInvBtn").textContent = "حفظ الفاتورة"; });
}
$("#cancelIEdit").onclick = cancelInvoiceEdit;

async function startEditInvoice(id) {
  let row = null;
  try {
    const { data } = await sb.from("invoices").select("*, products(name)").eq("id", id).single();
    if (data) row = data;
  } catch (_) {}
  const viewRow = recentInvoices.find(x => String(x.id) === String(id));
  if (!row && !viewRow) return;
  const src = { ...(viewRow || {}), ...(row || {}) };
  const resolved = resolveInvoiceMeta(src, readInvMeta());

  editingInvId = src.id;
  $("#iEditLabel").textContent = `تعديل الفاتورة ${src.invoice_no || ""}/${src.invoice_year || ""} — ${src.products?.name || src.product_name || ""}`;
  $("#iEditBanner").hidden = false;
  $("#addLine").hidden = true;

  $("#fi [name=invoice_no]").value = src.invoice_no || "";
  $("#fi [name=invoice_year]").value = src.invoice_year || new Date().getFullYear();
  $("#fi [name=invoice_date]").value = src.invoice_date || "";
  $("#fi [name=dossier_no]").value = src.dossier_no || "";
  $("#fi [name=farmer_card_no]").value = resolved.farmer_card_no || "";
  $("#fi [name=client_name]").value = src.client_name || "";
  $("#fi [name=farmer_name]").value = src.farmer_name || "";
  $("#fi [name=culture]").value = resolved.culture || "";
  $("#fi [name=region]").value = src.region || "";
  $("#fi [name=phone]").value = src.phone || "";
  $("#fi [name=notes]").value = src.notes || "";

  $("#lines").innerHTML = "";
  addLine();
  const ln = $("#lines").children[0];
  const pName = src.products?.name || src.product_name || "";
  ln.querySelector("[data-p]").value = pName;
  ln.querySelector("[data-q]").value = src.qty ?? "";
  ln.querySelector("[data-u]").value = src.unit_price ?? "";
  const wSel = ln.querySelector("[data-w]");
  fillWh(wSel, pName);
  if (src.warehouse_id != null) wSel.value = String(src.warehouse_id);

  $("#submitInvBtn").textContent = "حفظ التعديل";
  scheduleInvoiceValidation(true);
  $("#invoices").scrollIntoView({ behavior: "smooth", block: "start" });
}

async function loadRecentInvoices() {
  const { data, error } = await sb.from("invoice_balance").select("*").order("id", { ascending: false }).limit(80);
  if (error) return;
  recentInvoices = data || [];
  drawRecentInvoices();
}

function drawRecentInvoices() {
  const q = ($("#iq")?.value || "").trim().toLowerCase();
  const metaMap = readInvMeta();
  const rows = recentInvoices.filter(i => {
    const meta = resolveInvoiceMeta(i, metaMap);
    const hay = `${i.invoice_no}/${i.invoice_year} ${i.dossier_no || ""} ${meta.farmer_card_no || ""} ${i.client_name || ""} ${i.farmer_name || ""} ${i.product_name || ""} ${i.region || ""} ${i.phone || ""}`.toLowerCase();
    return !q || hay.includes(q);
  });
  $("#iT").innerHTML = tbl(
    ["رقم الفاتورة", "التاريخ", "الفلاح", "المنتج", "الكمية", "المتبقي", "المخزن", "إجراءات"],
    rows.map(i => [
      `<b>${esc(i.invoice_no)}/${esc(i.invoice_year)}</b>`,
      esc(i.invoice_date || "-"),
      esc(`${i.client_name || ""} ${i.farmer_name || ""}`.trim()),
      esc(i.product_name),
      n(i.qty),
      `<b>${n(i.remaining)}</b>`,
      esc(i.warehouse || "-"),
      `<div style="display:flex;gap:4px">
        <button type="button" class="f" data-edit-i="${i.id}">تعديل</button>
        <button type="button" class="p" data-del-i="${i.id}" style="background:var(--bad);padding:6px 10px">حذف</button>
      </div>`
    ])
  );
}
$("#iq").oninput = drawRecentInvoices;
$("#iT").onclick = async e => {
  const editBtn = e.target.closest("[data-edit-i]");
  if (editBtn) {
    await startEditInvoice(editBtn.dataset.editI);
    return;
  }
  const delBtn = e.target.closest("[data-del-i]");
  if (delBtn) {
    const id = delBtn.dataset.delI;
    if (!confirm("حذف سطر الفاتورة؟")) return;
    const { error } = await sb.from("invoices").delete().eq("id", id);
    if (error) return toast(error.code === "23503" ? "لا يمكن الحذف: توجد تسليمات مرتبطة بهذه الفاتورة" : error.message, 1);
    if (String(editingInvId) === String(id)) cancelInvoiceEdit();
    toast("تم حذف الفاتورة");
    loadRecentInvoices();
  }
};

$("#fi").onsubmit = async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  for (const k in f) if (f[k] === "") f[k] = null;
  if (f.farmer_card_no) f.farmer_card_no = f.farmer_card_no.trim().toUpperCase();
  if (f.culture) f.culture = f.culture.trim().replace(/\s+/g, " ").toUpperCase();
  try {
    if (editingInvId != null) {
      const d = $("#lines").children[0];
      const w = d.querySelector("[data-w]");
      const payload = {
        ...f,
        product_id: await productId(d.querySelector("[data-p]").value),
        qty: d.querySelector("[data-q]").value,
        unit_price: d.querySelector("[data-u]").value || null,
        warehouse_id: w.value || null,
        warehouse: w.value ? w.selectedOptions[0].text : null
      };
      let { error } = await sb.from("invoices").update(payload).eq("id", editingInvId);
      let missingCols = false;
      if (error && /(farmer_card_no|culture)/i.test(error.message || "")) {
        missingCols = true;
        const { farmer_card_no, culture, ...fallbackPayload } = payload;
        const retry = await sb.from("invoices").update(fallbackPayload).eq("id", editingInvId);
        error = retry.error;
      }
      if (error) throw error;
      if (f.farmer_card_no || f.culture) {
        saveInvMeta(f.invoice_no, f.invoice_year, {
          farmer_card_no: f.farmer_card_no || "",
          culture: f.culture || ""
        });
      }
      toast(missingCols ? "تم تعديل الفاتورة (بعض الحقول محفوظة محلياً)" : "تم تعديل الفاتورة");
      cancelInvoiceEdit();
      loadProducts();
      loadRecentInvoices();
      return;
    }

    const rows = [];
    for (const d of $("#lines").children) {
      const w = d.querySelector("[data-w]");
      rows.push({ ...f, product_id: await productId(d.querySelector("[data-p]").value), qty: d.querySelector("[data-q]").value,
        unit_price: d.querySelector("[data-u]").value || null, warehouse_id: w.value || null, warehouse: w.value ? w.selectedOptions[0].text : null });
    }
    let { error } = await sb.from("invoices").insert(rows);
    let missingCols = false;
    if (error && /(farmer_card_no|culture)/i.test(error.message || "")) {
      missingCols = true;

function findInvoiceStock(inv) {
  if (!inv || !stockList.length) return null;
  const byProd = stockList.filter(r => r.name === inv.product_name);
  if (!byProd.length) return null;
  if (inv.warehouse_id != null) {
    const exactId = byProd.find(r => String(r.wid) === String(inv.warehouse_id));
    if (exactId) return { balance: Number(exactId.balance), warehouse: exactId.warehouse || inv.warehouse || "المخزن" };
  }
  if (inv.warehouse) {
    const exactWh = byProd.find(r => r.warehouse === inv.warehouse);
    if (exactWh) return { balance: Number(exactWh.balance), warehouse: exactWh.warehouse };
  }
  const totalBal = byProd.reduce((s, r) => s + Number(r.balance || 0), 0);
  return { balance: totalBal, warehouse: byProd.length === 1 ? (byProd[0].warehouse || "المخزن") : "كل المخازن" };
}

  const limit = getStockThreshold();

  const qVal = Number($("#fp [name=qty]").value || 0);

  if (bal <= 0) {
    box.className = "alert-bad";

function resolveInvoiceMeta(row, metaMap) {
  const meta = metaMap[`${String(row.invoice_no || "").trim()}|${row.invoice_year}`] || {};
  const dByNo = row.dossier_no
    ? DOSSIER_REF.find(d => normVal(d.dossier_no) === normVal(row.dossier_no))
    : null;
  const rowFull = normVal(`${row.client_name || ""} ${row.farmer_name || ""}`);
  const rowFarmer = normVal(row.farmer_name);
  const dByName = !dByNo && (rowFull || rowFarmer)
    ? DOSSIER_REF.find(d => {
        const dn = normVal(d.farmer_name);
        return dn && (dn === rowFull || dn === rowFarmer);
      })
    : null;
  const dRef = dByNo || dByName;
  return {
    farmer_card_no: row.farmer_card_no || meta.farmer_card_no || dRef?.farmer_card_no || "",
    culture: row.culture || meta.culture || dRef?.culture || ""
  };
}

function formatInvSummary(g) {

  const dt = g.invoice_date ? ` (${esc(g.invoice_date)})` : "";
  const crop = g.culture ? ` [${esc(g.culture)}]` : "";
  return `فاتورة <b>${esc(g.invoice_no)}/${esc(g.invoice_year)}</b>${dt}${crop}${prods}`;
}

async function validateInvoiceRealtime() {
  const cardEl = $("#cardDupWarn");
  const nameEl = $("#nameDupWarn");
  const yearVal = Number($("#fi [name=invoice_year]")?.value || 0);
  const rawCard = $("#fi [name=farmer_card_no]")?.value || "";
  const rawClient = $("#fi [name=client_name]")?.value || "";
  const rawFarmer = $("#fi [name=farmer_name]")?.value || "";
  const rawCrop = $("#fi [name=culture]")?.value || "";

  const dCard = normCardVal(rawCard);
  const dClient = normVal(rawClient);
  const dFarmer = normVal(rawFarmer);
  const dFull = normVal(`${rawClient} ${rawFarmer}`);
  const dCrop = normVal(rawCrop);

  if (!yearVal || (!dCard && !dFull)) {
    setFieldAlert(cardEl, "", "");
    setFieldAlert(nameEl, "", "");
    return;
  }

  const seq = ++invValSeq;
  const { data, error } = await sb
    .from("invoices")
    .select("*, products(name)")
    .eq("invoice_year", yearVal);

  if (seq !== invValSeq) return;
  if (error || !Array.isArray(data)) return;

  const metaMap = readInvMeta();
  const grouped = new Map();
  for (const r of data) {
    if (editingInvId != null && String(r.id) === String(editingInvId)) continue;
    const key = `${String(r.invoice_no || "").trim()}|${r.invoice_year}`;
    const resolved = resolveInvoiceMeta(r, metaMap);
    let g = grouped.get(key);
    if (!g) {
      g = {
        invoice_no: r.invoice_no,
        invoice_year: r.invoice_year,
        invoice_date: r.invoice_date,
        client_name: r.client_name || "",
        farmer_name: r.farmer_name || "",
        full_name: normVal(`${r.client_name || ""} ${r.farmer_name || ""}`),
        farmer_only: normVal(r.farmer_name),
        farmer_card_no: resolved.farmer_card_no,
        card_norm: normCardVal(resolved.farmer_card_no),
        culture: resolved.culture,
        culture_norm: normVal(resolved.culture),
        products: []
      };
      grouped.set(key, g);
    } else {
      if (!g.card_norm && resolved.farmer_card_no) {
        g.farmer_card_no = resolved.farmer_card_no;
        g.card_norm = normCardVal(resolved.farmer_card_no);
      }
      if (!g.culture_norm && resolved.culture) {
        g.culture = resolved.culture;
        g.culture_norm = normVal(resolved.culture);
      }
    }
    const pName = r.products?.name;
    if (pName) {
      const label = r.qty != null ? `${pName} (${n(r.qty)} QTX)` : pName;
      if (!g.products.includes(label)) g.products.push(label);
    }
  }

  const invList = [...grouped.values()];

  // 1) التحقق برقم بطاقة الفلاح
  if (dCard) {
    const cardMatches = invList.filter(g => g.card_norm === dCard);
    const cardSameCrop = dCrop ? cardMatches.filter(g => g.culture_norm === dCrop) : [];
    const cardOther = cardMatches.filter(g => !cardSameCrop.includes(g));
    if (cardSameCrop.length) {
      setFieldAlert(
        cardEl,
        "bad",
        `<strong>تنبيه:</strong> رقم البطاقة (<b>${esc(rawCard.trim())}</b>) مسجّل بالفعل لنفس المحصول (<b>${esc(dCrop)}</b>) في موسم <b>${yearVal}</b>:<br>${cardSameCrop.map(formatInvSummary).join("<br>")}`
      );
    } else if (cardOther.length) {
      setFieldAlert(
        cardEl,
        "warn",
        `<strong>ملاحظة:</strong> رقم البطاقة (<b>${esc(rawCard.trim())}</b>) مسجّل في موسم <b>${yearVal}</b>:<br>${cardOther.map(formatInvSummary).join("<br>")}`
      );
    } else {
      setFieldAlert(cardEl, "", "");
    }
  } else {
    setFieldAlert(cardEl, "", "");
  }

  // 2) التحقق باسم الفلاح
  if (dFull) {
    const nameMatches = invList.filter(g => {
      const nameHit =
        (g.full_name && g.full_name === dFull) ||
        (g.farmer_only && dFarmer && !dClient && g.farmer_only === dFarmer) ||
        (g.full_name && dFarmer && !dClient && g.full_name === dFarmer) ||
        (g.farmer_only && g.farmer_only === dFull);
      if (!nameHit) return false;
      if (dCard && g.card_norm && dCard !== g.card_norm) return false;
      return true;
    });
    const nameSameCrop = dCrop ? nameMatches.filter(g => g.culture_norm === dCrop) : [];
    const nameOther = nameMatches.filter(g => !nameSameCrop.includes(g));
    if (nameSameCrop.length) {
      setFieldAlert(
        nameEl,
        "bad",
        `<strong>تنبيه:</strong> الفلاح (<b>${esc(dFull)}</b>) مسجّل بالفعل لنفس المحصول (<b>${esc(dCrop)}</b>) في موسم <b>${yearVal}</b>:<br>${nameSameCrop.map(formatInvSummary).join("<br>")}`
      );
    } else if (nameOther.length) {
      setFieldAlert(
        nameEl,
        "warn",
        `<strong>ملاحظة:</strong> الفلاح (<b>${esc(dFull)}</b>) لديه فاتورة في موسم <b>${yearVal}</b>:<br>${nameOther.map(formatInvSummary).join("<br>")}`
      );
    } else {
      setFieldAlert(nameEl, "", "");
    }
  } else {
    setFieldAlert(nameEl, "", "");
  }
}

function scheduleInvoiceValidation(immediate) {
  clearTimeout(invValTimer);
  if (immediate) {
    validateInvoiceRealtime();
  } else {
    invValTimer = setTimeout(validateInvoiceRealtime, 220);
  }
}

["invoice_year", "farmer_card_no", "client_name", "farmer_name", "culture", "dossier_no"].forEach(name => {
  const el = $(`#fi [name=${name}]`);
  if (!el) return;
  el.addEventListener("input", () => scheduleInvoiceValidation(false));
  el.addEventListener("change", () => scheduleInvoiceValidation(true));
});

startApp({
  page: "index",
  tabs: [
    ["invoices", "تسجيل فاتورة", ["invoices"], () => { loadLookups(); loadDossierAutofill(); loadRecentInvoices(); }],
    ["pickup", "تسليم السماد للفلاحين", ["pickup"], loadPickup],
    ["receipts", "الأسمدة الواردة للمخزن", ["receipts"], () => { loadLookups().then(loadReceipts); }]
  ],
  ready() {
    if (!$("#lines").children.length) addLine();
    $("#fi [name=invoice_year]").value = new Date().getFullYear();
    $("#fi [name=invoice_date]").value = today();
    $("#fp [name=w_date]").value = today();
    $("#fr [name=entry_date]").value = today();
    loadDossierAutofill();
    loadRecentInvoices();
  }
});
</script>
