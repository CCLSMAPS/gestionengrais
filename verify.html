<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحقق العام من إذن الخروج (QR) - CCLS ADRAR</title>
<meta name="description" content="صفحة تحقق عامة لصحة إذن خروج الأسمدة عبر رمز QR دون كشف البيانات الشخصية أو الحساسة.">
<meta name="theme-color" content="#175236">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="f761c70c-5eb3-4726-ab98-708bc5fb8c35.jfif">
<link rel="stylesheet" href="common.css">
</head>
<body>
<header>
  <div style="display:flex;gap:10px;align-items:center">
    <img src="f761c70c-5eb3-4726-ab98-708bc5fb8c35.jfif" alt="CCLS ADRAR" style="height:34px;width:34px;border-radius:6px;object-fit:contain;background:#fff;border:1px solid var(--bd)" onerror="this.style.display='none'">
    <h1>التحقق العام من إذن الخروج (CCLS ADRAR)</h1>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <a class="lk" id="staffGateLink" href="bons.html">بوابة الموظفين</a>
  </div>
</header>
<main style="max-width:780px;margin:0 auto;padding:22px 16px 40px">
  <section>
    <h2>التحقق من صحة الوثيقة عبر رمز QR</h2>
    <p style="margin:0 0 14px;color:var(--mu);font-size:.9rem">
      تتيح هذه الصفحة العامة التحقق الفوري من صحة إذن الخروج (رقمه، الكمية الإجمالية، والتاريخ) دون عرض أي بيانات شخصية أو حساسة لحماية الخصوصية.
    </p>
    <form id="pubVerifyForm" style="grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:12px">
      <label style="margin:0">رقم إذن الخروج أو رابط QR
        <input id="pubVerifyInput" placeholder="أدخل رقم الإذن (مثال: 1691)" autocomplete="off" required>
      </label>
      <button type="submit" class="p">تحقق من الوثيقة</button>
    </form>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <button type="button" class="f" id="pubStartCam">مسح بالكاميرا</button>
      <button type="button" class="f btn-danger" id="pubStopCam" hidden>إيقاف الكاميرا</button>
      <label class="f" style="display:inline-flex;flex-direction:row;align-items:center;gap:6px;margin:0;cursor:pointer;padding:9px 14px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);min-height:42px">
        <span>فحص من صورة QR</span>
        <input type="file" id="pubQrFile" accept="image/*" hidden>
      </label>
    </div>
    <div id="pubCamStatus" style="font-size:.83rem;color:var(--mu);margin-top:8px"></div>
    <div id="pubCamBox" class="verify-cam-box" hidden style="margin-top:10px">
      <video id="pubVideo" playsinline muted></video>
    </div>
    <canvas id="pubCanvas" hidden></canvas>
  </section>

  <section id="pubResultSec" hidden></section>
</main>
<div id="toast" role="status"></div>
<script src="dist/dossiers-pdf.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let pubStream = null;
let pubTimer = null;

function stopPubCam() {
  if (pubTimer) { clearTimeout(pubTimer); pubTimer = null; }
  if (pubStream) { pubStream.getTracks().forEach(t => t.stop()); pubStream = null; }
  const v = $("#pubVideo");
  if (v) v.srcObject = null;
  $("#pubCamBox").hidden = true;
  $("#pubStopCam").hidden = true;
  $("#pubStartCam").hidden = false;
}

function fmtDate(d) {
  if (!d) return "—";
  const parts = String(d).split("-");
  return parts.length === 3 ? `${parts[2]}/${parts[1]}/${parts[0]}` : d;
}

const PUBLIC_SB_URL = "https://ibznldpkdrqgcdnrxwnj.supabase.co";
const PUBLIC_SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imliem5sZHBrZHJxZ2NkbnJ4d25qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ5OTUwODUsImV4cCI6MjExMDU3MTA4NX0.LUyefDjCMWnac-cytLMkmOOLIPtgr0GdsPTWAqewJfw";

async function fetchPublicBonVerification(bonNo) {
  // 1) Try local/Node Express verification API when hosted with backend
  try {
    const resp = await fetch(`/api/public/verify-bon?bon=${encodeURIComponent(bonNo)}`, { cache: "no-store" });
    const ctype = (resp.headers.get("content-type") || "").toLowerCase();
    if (resp.ok && ctype.includes("application/json")) {
      return await resp.json();
    }
  } catch (_) {}

  // 2) Static hosting fallback (e.g. GitHub Pages): call privacy-safe Supabase RPC `verify_bon_public`
  const rpcResp = await fetch(`${PUBLIC_SB_URL}/rest/v1/rpc/verify_bon_public`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      apikey: PUBLIC_SB_ANON,
      Authorization: `Bearer ${PUBLIC_SB_ANON}`
    },
    body: JSON.stringify({ p_bon_no: bonNo })
  });
  if (rpcResp.ok) {
    const rows = await rpcResp.json();
    if (Array.isArray(rows) && rows.length > 0) {
      const items = rows.map(r => ({
        designation: String(r.designation || "سماد"),
        qty: Number(r.qty || 0)
      }));
      const totalQty = items.reduce((s, x) => s + x.qty, 0);
      return {
        valid: true,
        source: "supabase_rpc",
        bon_no: String(rows[0].bon_no || bonNo),
        sortie_date: String(rows[0].sortie_date || ""),
        camp: String(rows[0].camp || "2025/2026"),
        total_qty: Number(totalQty.toFixed(2)),
        item_count: items.length,
        items
      };
    }
    return { valid: false, bon_no: bonNo };
  }

  // 3) Check if RPC function isn't installed yet in Supabase, and check same-device non-PII local fallback
  let errCode = "";
  try {
    const errBody = await rpcResp.json();
    errCode = String(errBody?.code || errBody?.message || "");
  } catch (_) {}
  try {
    const rawLocal = JSON.parse(localStorage.getItem("ccls_bons_2026_2027") || "[]") || [];
    const matched = rawLocal.filter(b => String(b?.bon_no || "").trim().toLowerCase() === bonNo.toLowerCase());
    if (matched.length > 0) {
      const items = matched.map(r => ({
        designation: String(r.designation || "سماد"),
        qty: Number(r.qty || 0)
      }));
      const totalQty = items.reduce((s, x) => s + x.qty, 0);
      return {
        valid: true,
        source: "local",
        bon_no: String(matched[0].bon_no || bonNo),
        sortie_date: String(matched[0].sortie_date || ""),
        camp: String(matched[0].camp || "2025/2026"),
        total_qty: Number(totalQty.toFixed(2)),
        item_count: items.length,
        items
      };
    }
  } catch (_) {}

  if (/PGRST202|verify_bon_public|42883/i.test(errCode) || rpcResp.status === 404) {
    throw new Error("دالة التحقق العام غير مفعّلة في قاعدة البيانات بعد. يرجى تنفيذ ملف supabase-ops.sql في Supabase SQL Editor.");
  }
  throw new Error("تعذّر الاتصال بخادم التحقق حالياً. يرجى المحاولة لاحقاً.");
}

async function runPublicVerify(raw) {
  let bonNo = typeof window.extractBonNoFromScan === "function"
    ? window.extractBonNoFromScan(raw)
    : String(raw || "").trim();
  if (typeof window.extractBonNoFromScan !== "function" && bonNo) {
    const m = bonNo.match(/[?&](?:verify|bon|bon_no)=([^&#]+)/i) || bonNo.match(/^(?:CCLS[-_])?BON\s*[:#-]\s*([^\s|;]+)/i);
    if (m?.[1]) {
      try { bonNo = decodeURIComponent(m[1]).trim(); } catch (_) { bonNo = m[1].trim(); }
    }
  }
  if (!bonNo) return;
  $("#pubVerifyInput").value = bonNo;
  $("#staffGateLink").href = `bons.html?verify=${encodeURIComponent(bonNo)}`;

  const box = $("#pubResultSec");
  box.hidden = false;
  box.innerHTML = `<p style="margin:0;color:var(--mu)">جارٍ التحقق من صحة الوثيقة رقم <b>${esc(bonNo)}</b>...</p>`;

  try {
    const data = await fetchPublicBonVerification(bonNo);
    if (!data?.valid) {
      box.innerHTML = `
        <div class="verify-card verify-bad">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
            <strong style="font-size:1.05rem;color:var(--bad)">✕ وثيقة غير مسجلة أو غير صالحة</strong>
            <span class="tag-bad">مرفوضة</span>
          </div>
          <p style="margin:0;font-size:.92rem">لم يتم العثور على إذن خروج مسجل برقم <b>${esc(bonNo)}</b> في السجل الرسمي.</p>
        </div>`;
      return;
    }

    const itemsRows = (data.items || []).map((it, idx) => `
      <tr>
        <td>${idx + 1}</td>
        <td>${esc(it.designation)}</td>
        <td><b>${Number(it.qty || 0).toLocaleString("fr-FR", { maximumFractionDigits: 2 })} قنطار</b></td>
      </tr>`).join("");

    box.innerHTML = `
      <div class="verify-card verify-valid">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px">
          <strong style="font-size:1.08rem;color:var(--pr)">✓ وثيقة صالحة ومعتمدة رسمياً</strong>
          <span style="font-family:var(--font-mono);font-size:.88rem;font-weight:700">BON N° ${esc(data.bon_no)}</span>
        </div>
        <div class="cards" style="margin-bottom:12px">
          <div class="card"><b>${esc(data.bon_no)}</b><span>رقم الوثيقة</span></div>
          <div class="card"><b>${Number(data.total_qty || 0).toLocaleString("fr-FR", { maximumFractionDigits: 2 })} قنطار</b><span>الكمية الإجمالية</span></div>
          <div class="card"><b>${esc(fmtDate(data.sortie_date))}</b><span>تاريخ الإصدار</span></div>
          <div class="card"><b>${esc(data.camp || "—")}</b><span>الموسم الفلاحي</span></div>
        </div>
        ${itemsRows ? `
          <div class="w" style="margin-bottom:10px">
            <table>
              <thead><tr><th>#</th><th>الصنف</th><th>الكمية</th></tr></thead>
              <tbody>${itemsRows}</tbody>
            </table>
          </div>` : ""}
        <div style="font-size:.81rem;color:var(--mu)">
          حماية الخصوصية: تم التحقق من صحة الوثيقة وكميتها وتاريخها دون عرض أي بيانات شخصية أو معلومات مركبة.
        </div>
      </div>`;
  } catch (err) {
    box.innerHTML = `<div class="alert-bad">${esc(err?.message || "تعذّر الاتصال بخادم التحقق حالياً. يرجى المحاولة لاحقاً.")}</div>`;
  }
}

$("#pubVerifyForm").onsubmit = e => {
  e.preventDefault();
  runPublicVerify($("#pubVerifyInput").value);
};

let pubDetectorPromise = null;
let pubJsQrPromise = null;

async function getPubQrDetector() {
  if (typeof window.BarcodeDetector !== "function") return null;
  if (!pubDetectorPromise) {
    pubDetectorPromise = (async () => {
      try {
        if (typeof window.BarcodeDetector.getSupportedFormats === "function") {
          const fmts = await window.BarcodeDetector.getSupportedFormats();
          if (!Array.isArray(fmts) || !fmts.includes("qr_code")) return null;
        }
        return new window.BarcodeDetector({ formats: ["qr_code"] });
      } catch (_) {
        return null;
      }
    })();
  }
  return pubDetectorPromise;
}

function loadPubJsQrCdn() {
  if (typeof window.decodeQrFromImageData === "function" || typeof window.jsQR === "function") {
    return Promise.resolve(true);
  }
  if (pubJsQrPromise) return pubJsQrPromise;
  pubJsQrPromise = new Promise(resolve => {
    let settled = false;
    const done = ok => { if (!settled) { settled = true; resolve(ok); } };
    const timer = setTimeout(() => done(false), 6000);
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js";
    s.async = true;
    s.onload = () => { clearTimeout(timer); done(typeof window.jsQR === "function"); };
    s.onerror = () => { clearTimeout(timer); done(false); };
    document.head.appendChild(s);
  });
  return pubJsQrPromise;
}

function decodePubPixels(data, w, h) {
  if (typeof window.decodeQrFromImageData === "function") {
    const hit = window.decodeQrFromImageData(data, w, h);
    if (hit) return hit;
  }
  if (typeof window.jsQR === "function") {
    const hit = window.jsQR(data, w, h, { inversionAttempts: "attemptBoth" });
    if (hit?.data) return hit.data;
  }
  return null;
}

async function openPubCameraStream() {
  if (window.isSecureContext === false) throw new Error("تشغيل الكاميرا يتطلب فتح الصفحة عبر HTTPS.");
  if (!navigator.mediaDevices?.getUserMedia) throw new Error("الكاميرا غير متاحة في هذا المتصفح؛ استخدم رفع صورة QR أو أدخل الرقم يدوياً.");
  const attempts = [
    { video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
    { video: { facingMode: "environment" }, audio: false },
    { video: true, audio: false }
  ];
  let lastErr = null;
  for (const c of attempts) {
    try { return await navigator.mediaDevices.getUserMedia(c); } catch (e) {
      lastErr = e;
      if (e && (e.name === "NotAllowedError" || e.name === "PermissionDeniedError")) break;
    }
  }
  if (lastErr?.name === "NotAllowedError" || lastErr?.name === "PermissionDeniedError") {
    throw new Error("تم رفض إذن الكاميرا. فعّله من إعدادات المتصفح أو استخدم رفع صورة QR.");
  }
  throw new Error("تعذّر فتح الكاميرا. يمكنك رفع صورة QR أو كتابة رقم الإذن.");
}

$("#pubStartCam").onclick = async () => {
  const statusEl = $("#pubCamStatus");
  try {
    statusEl.textContent = "جارٍ تشغيل الكاميرا وتهيئة قارئ QR...";
    statusEl.style.color = "var(--mu)";
    const [stream] = await Promise.all([openPubCameraStream(), loadPubJsQrCdn(), getPubQrDetector()]);
    pubStream = stream;
    const v = $("#pubVideo");
    v.setAttribute("playsinline", "true");
    v.muted = true;
    v.srcObject = pubStream;
    await v.play();
    $("#pubCamBox").hidden = false;
    $("#pubStopCam").hidden = false;
    $("#pubStartCam").hidden = true;
    statusEl.textContent = "وجّه الكاميرا نحو رمز QR...";
    statusEl.style.color = "var(--pr)";
    const canvas = $("#pubCanvas");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    let tickCount = 0;
    let busy = false;
    const tick = async () => {
      if (!pubStream) return;
      if (!busy && v.readyState >= 2 && v.videoWidth && v.videoHeight) {
        busy = true;
        try {
          let code = null;
          const det = await getPubQrDetector();
          if (det) {
            try {
              const hits = await det.detect(v);
              if (hits?.[0]?.rawValue) code = String(hits[0].rawValue).trim();
            } catch (_) {}
          }
          if (!code && ctx && (typeof window.decodeQrFromImageData === "function" || typeof window.jsQR === "function")) {
            const vw = v.videoWidth, vh = v.videoHeight;
            const crop = (tickCount++ % 2 === 1) && Math.min(vw, vh) >= 360;
            const side = crop ? Math.round(Math.min(vw, vh) * 0.68) : 0;
            const sx = crop ? Math.round((vw - side) / 2) : 0;
            const sy = crop ? Math.round((vh - side) / 2) : 0;
            const sw = crop ? side : vw, sh = crop ? side : vh;
            const scale = Math.min(1, 720 / Math.max(sw, sh));
            canvas.width = Math.max(1, Math.round(sw * scale));
            canvas.height = Math.max(1, Math.round(sh * scale));
            ctx.drawImage(v, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
            const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
            code = decodePubPixels(img.data, canvas.width, canvas.height);
          }
          if (code) {
            stopPubCam();
            statusEl.textContent = "تمت قراءة الرمز بنجاح ✓";
            statusEl.style.color = "var(--pr)";
            runPublicVerify(code);
            return;
          }
        } catch (_) {
        } finally {
          busy = false;
        }
      }
      if (pubStream) pubTimer = setTimeout(tick, 140);
    };
    tick();
  } catch (err) {
    stopPubCam();
    statusEl.textContent = err?.message || "تعذّر فتح الكاميرا. يمكنك رفع صورة QR أو كتابة رقم الإذن.";
    statusEl.style.color = "var(--bad)";
  }
};

$("#pubStopCam").onclick = () => {
  stopPubCam();
  $("#pubCamStatus").textContent = "تم إيقاف الكاميرا.";
};

$("#pubQrFile").onchange = async e => {
  const file = e.target.files?.[0];
  e.target.value = "";
  if (!file) return;
  let code = await window.decodeQrFromFile?.(file).catch(() => null);
  if (!code) {
    const det = await getPubQrDetector();
    if (det && typeof window.createImageBitmap === "function") {
      try {
        const bmp = await window.createImageBitmap(file);
        try {
          const hits = await det.detect(bmp);
          if (hits?.[0]?.rawValue) code = String(hits[0].rawValue).trim();
        } finally { bmp.close?.(); }
      } catch (_) {}
    }
  }
  if (!code) {
    await loadPubJsQrCdn();
    if (typeof window.jsQR === "function") {
      const objUrl = URL.createObjectURL(file);
      try {
        const img = new Image();
        await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = objUrl; });
        const scale = Math.min(1, 1200 / Math.max(img.naturalWidth || 1, img.naturalHeight || 1));
        const c = $("#pubCanvas");
        c.width = Math.max(1, Math.round((img.naturalWidth || 1) * scale));
        c.height = Math.max(1, Math.round((img.naturalHeight || 1) * scale));
        const ctx = c.getContext("2d", { willReadFrequently: true });
        if (ctx) {
          ctx.drawImage(img, 0, 0, c.width, c.height);
          code = decodePubPixels(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height);
        }
      } catch (_) {} finally { URL.revokeObjectURL(objUrl); }
    }
  }
  if (!code) {
    $("#pubCamStatus").textContent = "لم يتم العثور على رمز QR واضح في الصورة.";
    $("#pubCamStatus").style.color = "var(--bad)";
    return;
  }
  $("#pubCamStatus").textContent = "تمت قراءة الرمز من الصورة ✓";
  $("#pubCamStatus").style.color = "var(--pr)";
  runPublicVerify(code);
};

const params = new URLSearchParams(window.location.search);
const initBon = params.get("bon") || params.get("verify") || params.get("bon_no");
if (initBon) runPublicVerify(initBon);
</script>
</body>
