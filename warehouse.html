<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تسيير المخزن - تسيير مخزون الأسمدة</title>
<link rel="stylesheet" href="common.css">
</head>
<body>
<header><div style="display:flex;gap:10px;align-items:center"><button class="p" id="menu" aria-label="القائمة" style="background:var(--ac);color:#1d2b22">☰</button><h1>تسيير المخزن - تسيير مخزون الأسمدة</h1></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span id="links" style="display:flex;gap:6px;flex-wrap:wrap"></span><span id="who" style="font-size:.85rem"></span><button class="p" id="pwb" hidden style="background:var(--ac);color:#1d2b22">كلمة المرور</button><button class="p" id="out" hidden style="background:var(--ac);color:#1d2b22">خروج</button></div></header>
<main>
<div id="cfg" class="box" hidden></div>
<div id="app" hidden>
<nav></nav>
<section id="stock" hidden>
  <h2>المخزون حسب المخزن والمنتج (بالقنطار)</h2>
  <div class="cards" id="cards"></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:10px">
    <label>بحث<input id="sq" placeholder="اسم المنتج"></label>
    <label>المخزن<select id="sw"></select></label>
    <label>نوع المنتج<select id="sc"></select></label>
  </div>
  <div class="w" id="stockT"></div>
</section>
<section id="invList" hidden>
  <h2>الفواتير</h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:10px">
    <label style="flex:1;min-width:200px">بحث<input id="q" placeholder="رقم الفاتورة أو الاسم"></label>
    <button type="button" class="f" data-s="all" aria-pressed="true">الكل</button>
    <button type="button" class="f" data-s="open" aria-pressed="false">قيد السحب</button>
    <button type="button" class="f" data-s="done" aria-pressed="false">مكتملة بالكامل</button>
    <button type="button" class="p" id="xi">تصدير CSV</button>
  </div>
  <div class="w" id="invT"></div>
</section>
<section id="log" hidden>
  <h2>سجل التسليمات</h2>
  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end;margin-bottom:10px">
    <label>بحث<input id="lq" placeholder="وصل الخروج، الهيكل، الفاتورة، الفلاح"></label>
    <label>من تاريخ<input id="d1" type="date"></label>
    <label>إلى تاريخ<input id="d2" type="date"></label>
    <button type="button" class="p" id="xl">تصدير CSV</button>
  </div>
  <div class="w" id="logT"></div>
</section>
<section id="catalog" hidden>
  <h2>المخازن</h2>
  <form id="fw">
    <label>اسم المخزن<input name="name" required></label>
    <label>الموقع<input name="location"></label>
    <div class="perms" id="wc" style="grid-column:1/-1"></div>
    <button class="p">إضافة مخزن</button>
  </form>
  <p style="color:var(--mu);font-size:.85rem">الأنواع المؤشَّر عليها هي المسموحة في المخزن؛ بلا تأشير يقبل كل الأنواع.</p>
  <div class="w" id="wT"></div>
  <h2 style="margin-top:16px">أنواع المنتجات</h2>
  <form id="fc"><label>اسم النوع<input name="name" required></label><button class="p">إضافة نوع</button></form>
  <div class="w" id="cT"></div>
  <h2 style="margin-top:16px">المنتجات (قمح، شعير، مبيدات، أسمدة...)</h2>
  <form id="fpr">
    <label>اسم المنتج<input name="name" required></label>
    <label>النوع<select name="category_id" id="pc" required></select></label>
    <label>مدة التوريد (أيام)<input name="lead_days" type="number" min="0" value="14"></label>
    <label>مخزون احتياطي (أيام)<input name="safety_days" type="number" min="0" value="7"></label>
    <button class="p">إضافة منتج</button>
  </form>
  <div class="w" id="prT"></div>
</section>
<section id="audit" hidden>
  <h2>سجل التعديلات (من غيّر ماذا ومتى)</h2>
  <div class="w" id="auT"></div>
</section>
</div>
</main>
<div id="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="common.js"></script>
<script>
let stockRows = [];
async function loadStock() {
  const [s, iv, w, wh, ct] = await Promise.all([
    sb.from("stock_analysis").select("*").order("name"),
    sb.from("invoice_balance").select("remaining"),
    sb.from("withdrawals").select("qty").gte("w_date", today().slice(0, 8) + "01"),
    sb.from("warehouses").select("id,name").order("name"),
    sb.from("product_categories").select("id,name").order("sort_order")]);
  if (s.error) return toast(s.error.message + " (نفّذ supabase-warehouses.sql)", 1);
  stockRows = s.data;
  fillSel("#sw", wh.data, "كل المخازن"); fillSel("#sc", ct.data, "كل الأنواع");
  const inv = iv.data || [], act = inv.filter(x => x.remaining > 0).length;
  const sum = a => (a || []).reduce((t, x) => t + Number(x.qty ?? x.balance), 0);
  const low = stockRows.filter(r => r.daily > 0 && r.balance <= r.reorder_point).length;
  $("#cards").innerHTML = [["إجمالي الباقي في المخازن (قنطار)", n(sum(stockRows))], ["فواتير نشطة", act],
    ["مواد تحت نقطة إعادة الطلب", low], ["المسلَّم هذا الشهر (قنطار)", n(sum(w.data))]]
    .map(([l, v]) => `<div class="card"><b>${v}</b><span>${l}</span></div>`).join("");
  drawStock();
}
function fillSel(sel, rows, all) {
  const cur = $(sel).value;
  $(sel).innerHTML = `<option value="">${all}</option>` + (rows || []).map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join("");
  $(sel).value = cur;
}
function drawStock() {
  const q = $("#sq").value.trim().toLowerCase(), w = $("#sw").value, c = $("#sc").value;
  const st = r => r.daily > 0 && r.balance <= r.reorder_point ? `<span class="${r.cover_days <= r.lead_days ? "bad" : "warn"}">اطلب الآن</span>` : "";
  $("#stockT").innerHTML = tbl(["المنتج", "المخزن", "الوارد", "المستلم", "الباقي", "المعدل اليومي", "أيام التغطية", "نقطة إعادة الطلب", "ABC", "الحالة"],
    stockRows.filter(r => r.name.toLowerCase().includes(q) && (!w || String(r.wid) === w) && (!c || String(r.category_id) === c))
      .map(r => [esc(r.name), esc(r.warehouse), n(r.received), n(r.withdrawn), `<span class="${r.balance < 0 ? "bad" : ""}">${n(r.balance)}</span>`,
        n(r.daily), r.cover_days ?? "-", n(r.reorder_point), r.abc, st(r)]));
}
["#sq", "#sw", "#sc"].forEach(x => $(x).oninput = drawStock);
let invoices = [];
async function loadInvoices() {
  const { data, error } = await sb.from("invoice_balance").select("*").order("id", { ascending: false }).limit(300);
  if (error) return toast(error.message, 1);
  invoices = data; drawInvoices();
}
function drawInvoices() {
  const q = $("#q").value.trim().toLowerCase();
  const rows = invView = invoices.filter(i =>
    (st === "all" || (st === "open" ? i.remaining > 0 : i.remaining <= 0)) &&
    (!q || `${i.invoice_no} ${i.client_name} ${i.farmer_name}`.toLowerCase().includes(q)));
  $("#invT").innerHTML = tbl(["الفاتورة", "التاريخ", "الفلاح", "السماد", "الكمية", "المستلم", "المتبقي"],
    rows.map(i => [`${esc(i.invoice_no)}/${i.invoice_year}`, i.invoice_date || "", esc(`${i.client_name || ""} ${i.farmer_name || ""}`),
      esc(i.product_name), n(i.qty), n(i.taken), `<b>${n(i.remaining)}</b>`]));
}
$("#q").oninput = drawInvoices;
let st = "all", invView = [], logRows = [], logView = [];
document.querySelectorAll(".f").forEach(b => b.onclick = () => {
  st = b.dataset.s;
  document.querySelectorAll(".f").forEach(x => x.setAttribute("aria-pressed", x === b));
  drawInvoices();
});
$("#xi").onclick = () => csv("invoices",
  ["الفاتورة", "التاريخ", "الفلاح", "السماد", "الكمية", "المستلم", "المتبقي", "الهاتف", "ملاحظات", "أُدخلت بواسطة"],
  invView.map(i => [`${i.invoice_no}/${i.invoice_year}`, i.invoice_date, `${i.client_name || ""} ${i.farmer_name || ""}`.trim(),
    i.product_name, i.qty, i.taken, i.remaining, i.phone, i.notes, i.created_by]));
const LOGH = ["التاريخ", "الفاتورة", "الفلاح", "السماد", "الكمية", "الهيكل / البطاقة الرمادية", "السائق", "الشاحنة", "وصل الخروج", "أُدخل بواسطة", "وقت الإدخال"];
async function loadLog() {
  const { data, error } = await sb.from("withdrawals")
    .select("*, invoices(invoice_no, invoice_year, client_name, farmer_name, products(name))")
    .order("id", { ascending: false }).limit(300);
  if (error) return toast(error.message, 1);
  logRows = data; drawLog();
}
function drawLog() {
  const q = $("#lq").value.trim().toLowerCase(), a = $("#d1").value, b = $("#d2").value;
  logView = logRows.filter(w => (!a || w.w_date >= a) && (!b || w.w_date <= b) &&
    (!q || Object.values({ ...w, ...w.invoices }).join(" ").toLowerCase().includes(q)))
    .map(w => { const i = w.invoices || {};
      return [w.w_date, `${i.invoice_no}/${i.invoice_year}`, `${i.client_name || ""} ${i.farmer_name || ""}`.trim(), i.products?.name,
        w.qty, w.vehicle_ref, w.driver_name, w.truck_no, w.bon_no, w.created_by, (w.created_at || "").slice(0, 16).replace("T", " ")]; });
  $("#logT").innerHTML = tbl(LOGH, logView.map(r => r.map(esc)));
}
["#lq", "#d1", "#d2"].forEach(s => $(s).oninput = drawLog);
$("#xl").onclick = () => csv("deliveries", LOGH, logView);
async function loadAudit() {
  const { data, error } = await sb.from("audit_log").select("*").order("id", { ascending: false }).limit(300);
  if (error) return toast(error.message, 1);
  const A = { INSERT: "إضافة", UPDATE: "تعديل", DELETE: "حذف" };
  const T = { products: "الأسمدة", stock_in: "الوارد", invoices: "الفواتير", withdrawals: "التسليمات" };
  $("#auT").innerHTML = tbl(["الوقت", "المستخدم", "العملية", "القسم", "رقم السجل"],
    data.map(r => [r.changed_at.slice(0, 16).replace("T", " "), esc(r.user_name || r.user_email), A[r.action], T[r.table_name] || r.table_name, r.row_id]));
}

// ----- المخازن وأنواع المنتجات والمنتجات -----
let CT = [];
const catBoxes = sel => CT.map(c => `<label><input type="checkbox" class="pc" value="${c.id}"${sel.includes(c.id) ? " checked" : ""}>${esc(c.name)}</label>`).join("");
const catOpts = cur => CT.map(c => `<option value="${c.id}"${c.id === cur ? " selected" : ""}>${esc(c.name)}</option>`).join("");
const btns = id => `<button class="p" data-id="${id}">حفظ</button> <button class="p" data-id="${id}" data-act="del" style="background:var(--bad)">حذف</button>`;
async function loadCatalogTab() {
  const [w, c, wc, p] = await Promise.all([sb.from("warehouses").select("*").order("name"),
    sb.from("product_categories").select("*").order("sort_order").order("name"),
    sb.from("warehouse_categories").select("*"), sb.from("products").select("*").order("name")]);
  const err = w.error || c.error || wc.error || p.error;
  if (err) return toast(err.message + " (نفّذ supabase-warehouses.sql)", 1);
  CT = c.data; $("#wc").innerHTML = catBoxes([]); $("#pc").innerHTML = catOpts();
  $("#wT").innerHTML = tbl(["المخزن", "الموقع", "الأنواع المسموحة", "مفعّل", ""], w.data.map(x => [
    `<input data-n value="${esc(x.name)}">`, `<input data-l value="${esc(x.location)}">`,
    `<div class="perms">${catBoxes(wc.data.filter(k => k.warehouse_id === x.id).map(k => k.category_id))}</div>`,
    `<input type="checkbox" data-a${x.active ? " checked" : ""}>`, btns(x.id)]));
  $("#cT").innerHTML = tbl(["النوع", ""], c.data.map(x => [`<input data-n value="${esc(x.name)}">`, btns(x.id)]));
  $("#prT").innerHTML = tbl(["المنتج", "النوع", "مدة التوريد (يوم)", "احتياطي (يوم)", ""], p.data.map(x => [esc(x.name),
    `<select data-c><option value="">—</option>${catOpts(x.category_id)}</select>`,
    `<input type="number" data-ld min="0" value="${x.lead_days}" style="width:80px">`,
    `<input type="number" data-sd min="0" value="${x.safety_days}" style="width:80px">`,
    `<button class="p" data-id="${x.id}">حفظ</button>`]));
}
async function run(q, ok) {
  const { error } = await q;
  if (error) return toast(error.code === "23503" ? "لا يمكن الحذف: توجد بيانات مرتبطة به" : error.code === "23505" ? "الاسم مستعمل من قبل" : error.message, 1);
  toast(ok); loadCatalogTab();
}
$("#fw").onsubmit = async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  const { data, error } = await sb.from("warehouses").insert({ name: f.get("name").trim(), location: f.get("location") || null }).select().single();
  if (error) return toast(error.code === "23505" ? "الاسم مستعمل من قبل" : error.message, 1);
  const cs = [...$("#wc").querySelectorAll(".pc:checked")].map(c => ({ warehouse_id: data.id, category_id: +c.value }));
  if (cs.length) await sb.from("warehouse_categories").insert(cs);
  e.target.reset(); toast("تمت الإضافة"); loadCatalogTab();
};
$("#fc").onsubmit = async e => { e.preventDefault(); await run(sb.from("product_categories").insert({ name: new FormData(e.target).get("name").trim() }), "تمت الإضافة"); e.target.reset(); };
$("#fpr").onsubmit = async e => {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  await run(sb.from("products").insert({ name: f.name.trim(), category_id: +f.category_id, lead_days: +f.lead_days, safety_days: +f.safety_days }), "تمت الإضافة");
  e.target.reset();
};
$("#wT").onclick = async e => {
  const b = e.target.closest("button[data-id]"); if (!b) return;
  const tr = b.closest("tr"), id = +b.dataset.id;
  if (b.dataset.act === "del") return confirm("حذف المخزن؟") && run(sb.from("warehouses").delete().eq("id", id), "تم الحذف");
  const { error } = await sb.from("warehouses").update({ name: tr.querySelector("[data-n]").value.trim(), location: tr.querySelector("[data-l]").value || null, active: tr.querySelector("[data-a]").checked }).eq("id", id);
  if (error) return toast(error.message, 1);
  await sb.from("warehouse_categories").delete().eq("warehouse_id", id);
  const cs = [...tr.querySelectorAll(".pc:checked")].map(c => ({ warehouse_id: id, category_id: +c.value }));
  if (cs.length) await sb.from("warehouse_categories").insert(cs);
  toast("تم الحفظ"); loadCatalogTab();
};
$("#cT").onclick = e => {
  const b = e.target.closest("button[data-id]"); if (!b) return;
  const id = +b.dataset.id;
  if (b.dataset.act === "del") return confirm("حذف النوع؟") && run(sb.from("product_categories").delete().eq("id", id), "تم الحذف");
  run(sb.from("product_categories").update({ name: b.closest("tr").querySelector("[data-n]").value.trim() }).eq("id", id), "تم الحفظ");
};
$("#prT").onclick = e => {
  const b = e.target.closest("button[data-id]"); if (!b) return;
  const tr = b.closest("tr");
  run(sb.from("products").update({ category_id: tr.querySelector("[data-c]").value || null, lead_days: +tr.querySelector("[data-ld]").value, safety_days: +tr.querySelector("[data-sd]").value }).eq("id", +b.dataset.id), "تم الحفظ");
};

startApp({
  page: "warehouse",
  tabs: [
    ["stock", "المخزون الكلي من الأسمدة", ["stock"], loadStock],
    ["invoices", "الفواتير", ["invList"], loadInvoices],
    ["log", "سجل التسليمات", ["log"], loadLog],
    ["audit", "سجل التعديلات", ["audit"], loadAudit],
    ["catalog", "المخازن والمنتجات", ["catalog"], loadCatalogTab]
  ]
});
</script>
</body>
</html>
